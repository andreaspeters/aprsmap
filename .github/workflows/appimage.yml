name: Anylinux-AppImage
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    tags:        
      - '*'
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-latest, name: Build AppImage, arch: x86_64 }
          # - { runs-on: ubuntu-24.04-arm, name: Build AppImage, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5
      - name: Install Dependencies
        run: /bin/sh ./appimage/get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./appimage/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  # this part runs via QEMU so expect higher CI times
  build-additional-cpu-arches:
    if: false # set to true to build the below arches
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # comment out the arches that are not wanted
          # note 'if: false' is set by default and these are all turned off
          - { name: Build AppImage, arch: riscv64, platform: linux/riscv64 }
          - { name: Build AppImage, arch: loongarch64, platform: linux/loong64 }
          - { name: Build AppImage, arch: ppc64le, platform: linux/ppc64le }
          - { name: Build AppImage, arch: ppc64, platform: linux/ppc64 } # BE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build AppImage (emulated)
        uses: pkgforge-dev/anylinux-setup-action/emulated@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5
        with:
          platform: ${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    # !cancelled() lets a release happen if build-additional-cpu-arches if turned off
    if: >-
      ${{ !cancelled() && github.ref_name == 'master'
      && needs.build.result == 'success'
      && needs.build-additional-cpu-arches.result != 'failure' }}
    needs: [build, build-additional-cpu-arches]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
      # appinfo is written by quick-sharun next to the AppImage, so it is
      # available here after downloading the artifacts
      - name: Read version from appinfo
        shell: sh
        run: |
          if [ ! -f ./appinfo ]; then
            >&2 echo "ERROR: No ./appinfo file found!"
            exit 1
          fi
          APPNAME=$(awk -F'=' '/X-AppImage-Name/{print $2; exit}' ./appinfo)
          VERSION=$(awk -F'=' '/X-AppImage-Version/{print $2; exit}' ./appinfo)
          if [ -z "$APPNAME" ]; then
            >&2 echo "ERROR: ./appinfo is missing X-AppImage-Name"
            exit 1
          elif [ -z "$VERSION" ]; then
            >&2 echo "ERROR: ./appinfo is missing X-AppImage-Version"
            exit 1
          fi
          echo "APPNAME=$APPNAME" >> "${GITHUB_ENV}"
          echo "VERSION=$VERSION" >> "${GITHUB_ENV}"
      - name: Release AppImage
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          name: "${{ env.APPNAME }}: ${{ env.VERSION }}"
          # plain version tag, no date or commit suffix
          tag_name: "${{ env.VERSION }}"
          prerelease: false
          draft: false
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          files: |
            *.AppImage
            *.AppImage.zsync
